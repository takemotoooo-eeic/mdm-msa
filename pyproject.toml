[project]
name = "exptemplete"
readme = "README.md"
description = "Research experiment template with Hydra configs, AMP, TensorBoard, and wandb"
authors = [
    {name = "takemotoooo-eeic", email = "takemoto-kengo2262@g.ecc.u-tokyo.ac.jp"}
]
requires-python = ">=3.10.0,<3.13"
dependencies = [
    "hydra-core>=1.3.0,<2.0",
    "omegaconf>=2.3.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "tensorboard>=2.15.0,<3.0",
    "wandb>=0.16.0,<1.0",
    "tqdm>=4.64.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "packaging>=23.0",
]

dynamic = [
    "version",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
exptemplete-parse-run-command = "exptemplete.bin.parse_run_command:main"

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["exptemplete*"]

[tool.setuptools.package-data]
exptemplete = ["configs/**/*.yaml"]

[tool.setuptools.dynamic]
version = {attr = "exptemplete.__version__"}

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
